services:
  app:
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./app:/app/app
      - ./data:/app/data:ro
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
